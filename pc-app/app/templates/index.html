{% extends "base.html" %}
{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center;">
    <h2>Log Absensi</h2>
    <a href="/api/export/excel" style="padding: 10px 15px; background-color: #217346; color: white; text-decoration: none; border-radius: 4px; font-weight: bold;">
        📊 Export ke Excel
    </a>
</div>
<div id="attendance-log">
    <p>Memuat data...</p>
</div>
<script>
    async function loadAttendance() {
        try {
            const resp = await fetch('/api/attendance?limit=50');
            const data = await resp.json();
            const log = document.getElementById('attendance-log');
            if (data && data.attendances) {
                let html = '<table><thead><tr><th>UID</th><th>Nama</th><th>Jam</th><th>Status</th></tr></thead><tbody>';
                data.attendances.forEach(a => {
                    const t = new Date(a.timestamp).toLocaleString('id-ID');
                    html += `<tr><td>${a.uid}</td><td>${a.name}</td><td>${t}</td><td>${a.status}</td></tr>`;
                });
                html += '</tbody></table>';
                log.innerHTML = html;
            }
        } catch(e) {
            console.error('Failed to load attendance:', e);
        }
    }
    loadAttendance();
    setInterval(loadAttendance, 10000);
</script>
{% endblock %}
