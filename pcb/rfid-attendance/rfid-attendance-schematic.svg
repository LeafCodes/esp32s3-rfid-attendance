<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <style>
    text { font-family: Consolas, monospace; }
    .title { font-size: 28px; font-weight: bold; fill: #000; }
    .subtitle { font-size: 14px; fill: #333; }
    .pin-label { font-size: 12px; fill: #000; }
    .wire-label { font-size: 11px; fill: #444; }
    .header { font-size: 13px; font-weight: bold; fill: #fff; }
    .note { font-size: 11px; fill: #666; }
    .component { font-size: 14px; font-weight: bold; fill: #000; }
    .value-text { font-size: 12px; fill: #555; }
    .power-text { font-size: 12px; font-weight: bold; }
  </style>

  <!-- Background -->
  <rect width="1200" height="900" fill="#fafafa" stroke="#ccc" stroke-width="2" rx="8"/>

  <!-- Title Block -->
  <rect x="10" y="10" width="1180" height="60" fill="#1a1a2e" rx="4"/>
  <text x="600" y="35" text-anchor="middle" class="title" fill="#fff">ESP32-S3 RFID Attendance System — Schematic</text>
  <text x="600" y="55" text-anchor="middle" class="subtitle" fill="#ccc">Rev 1.0 | 2026-08-08 | PCB: 100mm × 80mm Double-Sided</text>

  <!-- ===== ESP32-S3 DevKit Section ===== -->
  <rect x="400" y="100" width="380" height="500" fill="#e8f4fd" stroke="#2196f3" stroke-width="2.5" rx="6"/>
  <text x="590" y="125" text-anchor="middle" class="component" fill="#1565c0">ESP32-S3 DevKitC-1</text>
  <text x="590" y="145" text-anchor="middle" class="value-text">40-Pin Header (Hanya Pin Terpakai)</text>

  <!-- ESP32 pin headers -->
  <rect x="370" y="160" width="60" height="20" fill="#2196f3" rx="3"/>
  <text x="400" y="174" text-anchor="middle" class="header">PIN</text>
  <rect x="430" y="160" width="320" height="20" fill="#2196f3" rx="3"/>
  <text x="590" y="174" text-anchor="middle" class="header">FUNCTION / CONNECTION</text>

  <!-- ESP32 pins -->
  <!-- 3v3 -->
  <rect x="370" y="185" width="60" height="22" fill="#e3f2fd" stroke="#90caf9" stroke-width="0.5" rx="2"/>
  <text x="400" y="200" text-anchor="middle" class="pin-label" fill="#c62828">3.3V</text>
  <rect x="430" y="185" width="320" height="22" fill="#fff" stroke="#eee" stroke-width="0.5" rx="2"/>
  <text x="445" y="200" class="wire-label">Power output → MFRC522 VCC (3.3V)</text>

  <!-- GND -->
  <rect x="370" y="212" width="60" height="22" fill="#e3f2fd" stroke="#90caf9" stroke-width="0.5" rx="2"/>
  <text x="400" y="227" text-anchor="middle" class="pin-label" fill="#333">GND</text>
  <rect x="430" y="212" width="320" height="22" fill="#fff" stroke="#eee" stroke-width="0.5" rx="2"/>
  <text x="445" y="227" class="wire-label">Common ground — semua komponen</text>

  <!-- GPIO8 -->
  <rect x="370" y="239" width="60" height="22" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="0.5" rx="2"/>
  <text x="400" y="254" text-anchor="middle" class="pin-label">GPIO 8</text>
  <rect x="430" y="239" width="320" height="22" fill="#fff" stroke="#eee" stroke-width="0.5" rx="2"/>
  <text x="445" y="254" class="wire-label">I2C SDA → LCD 16x2 (SDA)</text>

  <!-- GPIO9 -->
  <rect x="370" y="266" width="60" height="22" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="0.5" rx="2"/>
  <text x="400" y="281" text-anchor="middle" class="pin-label">GPIO 9</text>
  <rect x="430" y="266" width="320" height="22" fill="#fff" stroke="#eee" stroke-width="0.5" rx="2"/>
  <text x="445" y="281" class="wire-label">I2C SCL → LCD 16x2 (SCL)</text>

  <!-- GPIO10 -->
  <rect x="370" y="293" width="60" height="22" fill="#fff3e0" stroke="#ffcc80" stroke-width="0.5" rx="2"/>
  <text x="400" y="308" text-anchor="middle" class="pin-label">GPIO 10</text>
  <rect x="430" y="293" width="320" height="22" fill="#fff" stroke="#eee" stroke-width="0.5" rx="2"/>
  <text x="445" y="308" class="wire-label">SPI SS (SDA) → MFRC522 SDA</text>

  <!-- GPIO11 -->
  <rect x="370" y="320" width="60" height="22" fill="#fff3e0" stroke="#ffcc80" stroke-width="0.5" rx="2"/>
  <text x="400" y="335" text-anchor="middle" class="pin-label">GPIO 11</text>
  <rect x="430" y="320" width="320" height="22" fill="#fff" stroke="#eee" stroke-width="0.5" rx="2"/>
  <text x="445" y="335" class="wire-label">SPI MOSI → MFRC522 MOSI</text>

  <!-- GPIO12 -->
  <rect x="370" y="347" width="60" height="22" fill="#fff3e0" stroke="#ffcc80" stroke-width="0.5" rx="2"/>
  <text x="400" y="362" text-anchor="middle" class="pin-label">GPIO 12</text>
  <rect x="430" y="347" width="320" height="22" fill="#fff" stroke="#eee" stroke-width="0.5" rx="2"/>
  <text x="445" y="362" class="wire-label">SPI SCK → MFRC522 SCK</text>

  <!-- GPIO13 -->
  <rect x="370" y="374" width="60" height="22" fill="#fff3e0" stroke="#ffcc80" stroke-width="0.5" rx="2"/>
  <text x="400" y="389" text-anchor="middle" class="pin-label">GPIO 13</text>
  <rect x="430" y="374" width="320" height="22" fill="#fff" stroke="#eee" stroke-width="0.5" rx="2"/>
  <text x="445" y="389" class="wire-label">SPI MISO → MFRC522 MISO</text>

  <!-- GPIO14 -->
  <rect x="370" y="401" width="60" height="22" fill="#fff3e0" stroke="#ffcc80" stroke-width="0.5" rx="2"/>
  <text x="400" y="416" text-anchor="middle" class="pin-label">GPIO 14</text>
  <rect x="430" y="401" width="320" height="22" fill="#fff" stroke="#eee" stroke-width="0.5" rx="2"/>
  <text x="445" y="416" class="wire-label">SPI RST → MFRC522 RST</text>

  <!-- GPIO15 -->
  <rect x="370" y="428" width="60" height="22" fill="#fce4ec" stroke="#f48fb1" stroke-width="0.5" rx="2"/>
  <text x="400" y="443" text-anchor="middle" class="pin-label">GPIO 15</text>
  <rect x="430" y="428" width="320" height="22" fill="#fff" stroke="#eee" stroke-width="0.5" rx="2"/>
  <text x="445" y="443" class="wire-label">Buzzer (via 220Ω) → Buzzer +</text>

  <!-- GPIO16 -->
  <rect x="370" y="455" width="60" height="22" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="0.5" rx="2"/>
  <text x="400" y="470" text-anchor="middle" class="pin-label">GPIO 16</text>
  <rect x="430" y="455" width="320" height="22" fill="#fff" stroke="#eee" stroke-width="0.5" rx="2"/>
  <text x="445" y="470" class="wire-label">LED Hijau (via 220Ω) → Anoda LED</text>

  <!-- GPIO17 -->
  <rect x="370" y="482" width="60" height="22" fill="#fce4ec" stroke="#f48fb1" stroke-width="0.5" rx="2"/>
  <text x="400" y="497" text-anchor="middle" class="pin-label">GPIO 17</text>
  <rect x="430" y="482" width="320" height="22" fill="#fff" stroke="#eee" stroke-width="0.5" rx="2"/>
  <text x="445" y="497" class="wire-label">LED Merah (via 220Ω) → Anoda LED</text>

  <!-- 5V -->
  <rect x="370" y="509" width="60" height="22" fill="#e3f2fd" stroke="#90caf9" stroke-width="0.5" rx="2"/>
  <text x="400" y="524" text-anchor="middle" class="pin-label" fill="#c62828">5V</text>
  <rect x="430" y="509" width="320" height="22" fill="#fff" stroke="#eee" stroke-width="0.5" rx="2"/>
  <text x="445" y="524" class="wire-label">Power → LCD VCC (5V) + VIN bus</text>

  <!-- ===== MFRC522 Section ===== -->
  <rect x="40" y="100" width="270" height="220" fill="#fff8e1" stroke="#ff9800" stroke-width="2" rx="6"/>
  <text x="175" y="125" text-anchor="middle" class="component" fill="#e65100">MFRC522 RFID Module</text>
  <text x="175" y="145" text-anchor="middle" class="value-text">SPI Interface | 13.56MHz</text>

  <rect x="55" y="158" width="240" height="18" fill="#ff9800" rx="3"/>
  <text x="175" y="172" text-anchor="middle" class="header">MFRC522 PIN → ESP32-S3</text>

  <!-- MFRC522 pins -->
  <rect x="55" y="181" width="120" height="20" fill="#ffe0b2" stroke="#ffb74d" stroke-width="0.5" rx="2"/>
  <text x="65" y="195" class="pin-label">SDA (SS)</text>
  <rect x="175" y="181" width="120" height="20" fill="#fff" stroke="#eee" rx="2"/>
  <text x="185" y="195" class="wire-label">→ GPIO 10</text>

  <rect x="55" y="206" width="120" height="20" fill="#ffe0b2" stroke="#ffb74d" stroke-width="0.5" rx="2"/>
  <text x="65" y="220" class="pin-label">SCK</text>
  <rect x="175" y="206" width="120" height="20" fill="#fff" stroke="#eee" rx="2"/>
  <text x="185" y="220" class="wire-label">→ GPIO 12</text>

  <rect x="55" y="231" width="120" height="20" fill="#ffe0b2" stroke="#ffb74d" stroke-width="0.5" rx="2"/>
  <text x="65" y="245" class="pin-label">MOSI</text>
  <rect x="175" y="231" width="120" height="20" fill="#fff" stroke="#eee" rx="2"/>
  <text x="185" y="245" class="wire-label">→ GPIO 11</text>

  <rect x="55" y="256" width="120" height="20" fill="#ffe0b2" stroke="#ffb74d" stroke-width="0.5" rx="2"/>
  <text x="65" y="270" class="pin-label">MISO</text>
  <rect x="175" y="256" width="120" height="20" fill="#fff" stroke="#eee" rx="2"/>
  <text x="185" y="270" class="wire-label">→ GPIO 13</text>

  <rect x="55" y="281" width="120" height="20" fill="#ffe0b2" stroke="#ffb74d" stroke-width="0.5" rx="2"/>
  <text x="65" y="295" class="pin-label">RST</text>
  <rect x="175" y="281" width="120" height="20" fill="#fff" stroke="#eee" rx="2"/>
  <text x="185" y="295" class="wire-label">→ GPIO 14</text>

  <!-- ===== LCD Section ===== -->
  <rect x="40" y="350" width="270" height="170" fill="#e8f5e9" stroke="#43a047" stroke-width="2" rx="6"/>
  <text x="175" y="375" text-anchor="middle" class="component" fill="#2e7d32">LCD 16×2 I2C</text>
  <text x="175" y="395" text-anchor="middle" class="value-text">Address 0x27 / 0x3F</text>

  <rect x="55" y="408" width="240" height="18" fill="#43a047" rx="3"/>
  <text x="175" y="422" text-anchor="middle" class="header">LCD PIN → ESP32-S3</text>

  <rect x="55" y="435" width="120" height="20" fill="#c8e6c9" stroke="#81c784" stroke-width="0.5" rx="2"/>
  <text x="65" y="449" class="pin-label">SDA</text>
  <rect x="175" y="435" width="120" height="20" fill="#fff" stroke="#eee" rx="2"/>
  <text x="185" y="449" class="wire-label">→ GPIO 8</text>

  <rect x="55" y="460" width="120" height="20" fill="#c8e6c9" stroke="#81c784" stroke-width="0.5" rx="2"/>
  <text x="65" y="474" class="pin-label">SCL</text>
  <rect x="175" y="460" width="120" height="20" fill="#fff" stroke="#eee" rx="2"/>
  <text x="185" y="474" class="wire-label">→ GPIO 9</text>

  <rect x="55" y="485" width="120" height="20" fill="#c8e6c9" stroke="#81c784" stroke-width="0.5" rx="2"/>
  <text x="65" y="499" class="pin-label">VCC</text>
  <rect x="175" y="485" width="120" height="20" fill="#fff" stroke="#eee" rx="2"/>
  <text x="185" y="499" class="wire-label">→ 5V / VIN</text>

  <!-- ===== Buzzer & LED Section ===== -->
  <rect x="40" y="550" width="270" height="130" fill="#fce4ec" stroke="#e91e63" stroke-width="2" rx="6"/>
  <text x="175" y="575" text-anchor="middle" class="component" fill="#c2185b">Buzzer &amp; LED Indicator</text>

  <rect x="55" y="588" width="240" height="18" fill="#e91e63" rx="3"/>
  <text x="175" y="602" text-anchor="middle" class="header">COMPONENT → ESP32-S3 (via Resistor)</text>

  <rect x="55" y="615" width="180" height="20" fill="#f8bbd0" stroke="#f48fb1" stroke-width="0.5" rx="2"/>
  <text x="65" y="629" class="pin-label">Buzzer+ (via 220Ω)</text>
  <rect x="235" y="615" width="60" height="20" fill="#fff" stroke="#eee" rx="2"/>
  <text x="240" y="629" class="wire-label">→ GPIO15</text>

  <rect x="55" y="640" width="180" height="20" fill="#c8e6c9" stroke="#81c784" stroke-width="0.5" rx="2"/>
  <text x="65" y="654" class="pin-label">LED Hijau (via 220Ω)</text>
  <rect x="235" y="640" width="60" height="20" fill="#fff" stroke="#eee" rx="2"/>
  <text x="240" y="654" class="wire-label">→ GPIO16</text>

  <rect x="55" y="665" width="180" height="20" fill="#f8bbd0" stroke="#f48fb1" stroke-width="0.5" rx="2"/>
  <text x="65" y="679" class="pin-label">LED Merah (via 220Ω)</text>
  <rect x="235" y="665" width="60" height="20" fill="#fff" stroke="#eee" rx="2"/>
  <text x="240" y="679" class="wire-label">→ GPIO17</text>

  <!-- ===== Power Section ===== -->
  <rect x="40" y="710" width="270" height="95" fill="#ede7f6" stroke="#5e35b1" stroke-width="2" rx="6"/>
  <text x="175" y="735" text-anchor="middle" class="component" fill="#4527a0">Power Input</text>
  <text x="175" y="755" text-anchor="middle" class="value-text">USB-C 5V DC | 500mA+</text>

  <rect x="70" y="768" width="210" height="25" fill="#d1c4e9" stroke="#b39ddb" stroke-width="0.5" rx="4"/>
  <text x="175" y="785" text-anchor="middle" class="power-text" fill="#4a148c">+5V → VIN Bus   |   GND → Ground Plane</text>

  <!-- ===== Right Side: Notes ===== -->
  <rect x="820" y="100" width="350" height="250" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="6"/>
  <text x="995" y="125" text-anchor="middle" class="component" fill="#333">Design Notes</text>

  <text x="835" y="155" class="note" font-weight="bold">⚡ Power:</text>
  <text x="845" y="173" class="note">• Input 5V via USB-C</text>
  <text x="845" y="191" class="note">• MFRC522 powered by 3.3V regulator on ESP32</text>
  <text x="845" y="209" class="note">• LCD backlight powered by 5V VIN</text>
  <text x="845" y="227" class="note">• Capacitor 100µF on VCC-GND for stability</text>

  <text x="835" y="258" class="note" font-weight="bold">🔧 Resistors:</text>
  <text x="845" y="276" class="note">• R1: 220Ω — LED Hijau current limiting</text>
  <text x="845" y="294" class="note">• R2: 220Ω — LED Merah current limiting</text>
  <text x="845" y="312" class="note">• R3: 220Ω — Buzzer current limiting</text>
  <text x="845" y="330" class="note">• R4,R5: 4.7kΩ — I2C pull-up (opsional)</text>

  <!-- ===== Right Side: BOM ===== -->
  <rect x="820" y="380" width="350" height="310" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="6"/>
  <text x="995" y="405" text-anchor="middle" class="component" fill="#333">Bill of Materials (BOM)</text>

  <rect x="830" y="418" width="30" height="18" fill="#666" rx="2"/>
  <text x="845" y="432" text-anchor="middle" fill="#fff" font-size="10">#</text>
  <rect x="862" y="418" width="200" height="18" fill="#666" rx="2"/>
  <text x="962" y="432" text-anchor="middle" fill="#fff" font-size="10">Component</text>
  <rect x="1064" y="418" width="50" height="18" fill="#666" rx="2"/>
  <text x="1089" y="432" text-anchor="middle" fill="#fff" font-size="10">Qty</text>
  <rect x="1116" y="418" width="45" height="18" fill="#666" rx="2"/>
  <text x="1138" y="432" text-anchor="middle" fill="#fff" font-size="10">Pkg</text>

  <text x="845" y="455" class="note">1</text>
  <text x="870" y="455" class="note">ESP32-S3 DevKitC-1</text>
  <text x="1089" y="455" text-anchor="middle" class="note">1</text>
  <text x="1138" y="455" text-anchor="middle" class="note">THT</text>

  <text x="845" y="475" class="note">2</text>
  <text x="870" y="475" class="note">MFRC522 RFID Module</text>
  <text x="1089" y="475" text-anchor="middle" class="note">1</text>
  <text x="1138" y="475" text-anchor="middle" class="note">PIN</text>

  <text x="845" y="495" class="note">3</text>
  <text x="870" y="495" class="note">LCD 16x2 I2C Module</text>
  <text x="1089" y="495" text-anchor="middle" class="note">1</text>
  <text x="1138" y="495" text-anchor="middle" class="note">PIN</text>

  <text x="845" y="515" class="note">4</text>
  <text x="870" y="515" class="note">Buzzer Active 5V</text>
  <text x="1089" y="515" text-anchor="middle" class="note">1</text>
  <text x="1138" y="515" text-anchor="middle" class="note">THT</text>

  <text x="845" y="535" class="note">5</text>
  <text x="870" y="535" class="note">LED 5mm Green</text>
  <text x="1089" y="535" text-anchor="middle" class="note">1</text>
  <text x="1138" y="535" text-anchor="middle" class="note">THT</text>

  <text x="845" y="555" class="note">6</text>
  <text x="870" y="555" class="note">LED 5mm Red</text>
  <text x="1089" y="555" text-anchor="middle" class="note">1</text>
  <text x="1138" y="555" text-anchor="middle" class="note">THT</text>

  <text x="845" y="575" class="note">7</text>
  <text x="870" y="575" class="note">Resistor 220Ω 1/4W</text>
  <text x="1089" y="575" text-anchor="middle" class="note">3</text>
  <text x="1138" y="575" text-anchor="middle" class="note">THT</text>

  <text x="845" y="595" class="note">8</text>
  <text x="870" y="595" class="note">Resistor 4.7kΩ 1/4W</text>
  <text x="1089" y="595" text-anchor="middle" class="note">2</text>
  <text x="1138" y="595" text-anchor="middle" class="note">THT</text>

  <text x="845" y="615" class="note">9</text>
  <text x="870" y="615" class="note">Capacitor 100µF 16V</text>
  <text x="1089" y="615" text-anchor="middle" class="note">2</text>
  <text x="1138" y="615" text-anchor="middle" class="note">THT</text>

  <text x="845" y="635" class="note">10</text>
  <text x="870" y="635" class="note">Pin Header 2.54mm (M/F)</text>
  <text x="1089" y="635" text-anchor="middle" class="note">4</text>
  <text x="1138" y="635" text-anchor="middle" class="note">THT</text>

  <text x="845" y="655" class="note">11</text>
  <text x="870" y="655" class="note">USB-C Cable Power</text>
  <text x="1089" y="655" text-anchor="middle" class="note">1</text>
  <text x="1138" y="655" text-anchor="middle" class="note">—</text>

  <text x="845" y="675" class="note">12</text>
  <text x="870" y="675" class="note">PCB Board 100×80mm</text>
  <text x="1089" y="675" text-anchor="middle" class="note">1</text>
  <text x="1138" y="675" text-anchor="middle" class="note">DS</text>

  <!-- Board Dimension Info -->
  <rect x="820" y="720" width="350" height="150" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="6"/>
  <text x="995" y="745" text-anchor="middle" class="component" fill="#333">PCB Fabrication Specs</text>

  <text x="835" y="770" class="note">Board Size: <tspan font-weight="bold">100mm × 80mm</tspan></text>
  <text x="835" y="788" class="note">Layers: <tspan font-weight="bold">2 (Double-Sided)</tspan></text>
  <text x="835" y="806" class="note">Thickness: <tspan font-weight="bold">1.6mm FR-4</tspan></text>
  <text x="835" y="824" class="note">Copper: <tspan font-weight="bold">1oz</tspan></text>
  <text x="835" y="842" class="note">Min Track: <tspan font-weight="bold">0.25mm (10mil)</tspan></text>
  <text x="835" y="860" class="note">Min Clearance: <tspan font-weight="bold">0.2mm (8mil)</tspan></text>

  <!-- Footer -->
  <line x1="10" y1="880" x2="1190" y2="880" stroke="#ccc" stroke-width="1"/>
  <text x="600" y="896" text-anchor="middle" class="note">Schematic v1.0 | ESP32-S3 RFID Attendance System | Print at 100% Scale (A4)</text>
</svg>
